[package]
name = "foldfin"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"], optional = true }
h2 = "0.4"
h3 = { version = "0.0.8", optional = true }
h3-datagram = { version = "0.0.2", optional = true }
h3-quinn = { version = "0.0.10", optional = true, features = ["datagram"] }
http = "1"
ipnet = "2.12.2"
libc = "0.2.189"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
rustls = { optional = true, version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = { version = "2", optional = true }
subtle = "2"
thiserror = "2.0.21"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { optional = true, version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
webpki-roots = { version = "1", optional = true }

[features]
default = ["client", "server", "cli"]
client = ["rustls"]
server = ["rustls"]
rustls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:webpki-roots"]
cli = ["client", "server", "dep:clap", "dep:tracing-subscriber", "tokio/rt-multi-thread", "tokio/signal"]
h3 = ["rustls", "dep:quinn", "dep:h3", "dep:h3-quinn", "dep:h3-datagram"]

[patch.crates-io]
h3 = { path = "vendor/h3" }
h3-datagram = { path = "vendor/h3-datagram" }
h3-quinn = { path = "vendor/h3-quinn" }

[[bin]]
name = "foldfin"
path = "src/bin/foldfin.rs"
required-features = ["cli"]

# Compatibility launchers for existing deployment and acceptance scripts.
[[bin]]
name = "client"
path = "src/bin/client.rs"
required-features = ["cli"]

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["cli"]

[dev-dependencies]
tempfile = "3.27.0"
